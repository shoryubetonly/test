services:
  web:
    build: .
    container_name: tbook-web
    ports:
      - "8055:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: tbook-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: s673190114
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tbook-phpmyadmin
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db